name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, zip, gd, dom, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style (Pint)
        run: composer lint

      - name: Tests (PHPUnit)
        run: composer test

      - name: Legacy script tests
        run: composer test:scripts

      - name: Container files (entrypoint syntax, compose file)
        run: |
          sh -n docker-entrypoint.sh
          cp .env.example .env
          DB_PASSWORD=ci MYSQL_ROOT_PASSWORD=ci docker compose config -q

      - name: Route cache (no closures in routes)
        run: php artisan route:cache && php artisan route:clear

      - name: Security audit
        run: composer audit
