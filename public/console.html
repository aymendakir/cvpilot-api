<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CVPilot · Account & administration</title><style>body{margin:0;background:#07101f;color:#eef4ff;font:16px/1.6 system-ui}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;gap:24px;align-items:center;border-bottom:1px solid #31415a}h1{font-size:36px}button,input,select{font:inherit;border-radius:8px;padding:10px 14px}button{background:#87f36b;color:#06101d;border:0;cursor:pointer}button:disabled{opacity:.5}input,select{background:#10213a;color:white;border:1px solid #354860;width:100%;box-sizing:border-box}label{display:block;margin:14px 0}nav{display:flex;flex-wrap:wrap;gap:10px}.panel{background:#0d1a2d;border:1px solid #2e4360;padding:24px;border-radius:18px;margin:20px 0}#message{white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #334763;word-break:break-word}.table-wrap{overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.metric{background:#132640;padding:18px;border-radius:10px}.metric strong{display:block;font-size:30px}small{color:#a4b5cc}a{color:#87f36b}form{max-width:680px}pre{white-space:pre-wrap}</style><header><b>CVPilot AI</b><span>Account & administration</span></header><main><nav id="nav"></nav><p id="message" role="status"></p><div id="view"></div></main><script type="module">
let csrf='',user=null,page=1;const view=document.querySelector('#view'),nav=document.querySelector('#nav'),message=document.querySelector('#message');
const node=(tag,text='',parent=view)=>{const e=document.createElement(tag);e.textContent=text;parent.append(e);return e};
async function api(path,method='GET',data){if(!csrf)csrf=(await fetch('/api/csrf',{headers:{Accept:'application/json'}}).then(r=>r.json())).token;const r=await fetch('/api/'+path,{method,headers:{Accept:'application/json','Content-Type':'application/json','X-CSRF-TOKEN':csrf},...(data?{body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d;}
function clear(title){view.replaceChildren();message.textContent='';node('h1',title)}
function action(label,fn,parent=nav){const b=node('button',label,parent);b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){message.textContent=e.message}finally{b.disabled=false}};return b}
function form(title,fields,submit){clear(title);const f=node('form');f.className='panel';for(const [key,label,type='text']of fields){const l=node('label',label,f),i=node('input','',l);i.name=key;i.type=type;i.required=true;i.autocomplete=type==='password'?'off':'on';if(type==='password')i.minLength=12;}const b=node('button','Continue',f);f.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await submit(Object.fromEntries(new FormData(f)))}catch(e){message.textContent=e.message}finally{b.disabled=false}};return f}
function menus(){nav.replaceChildren();if(!user){action('Sign in',login);action('Sign up',register);action('Verify email',()=>otp('verify'));action('Reset password',()=>otp('reset'));return}action('Profile',profile);action('Password',password);action('Jobs',jobs);action('AI assistant',assistant);if(user.role==='admin'){action('Dashboard',dashboard);action('Users',()=>listing('users'));action('Security logs',()=>listing('logs'));action('API keys',integrations)}action('Sign out',async()=>{await api('logout','POST');user=null;csrf='';menus();login()})}
function login(){form('Welcome back',[['email','Email','email'],['password','Password','password']],async d=>{user=await api('login','POST',d);menus();await profile()})}
function register(){form('Create your account',[['name','Full name'],['email','Email','email'],['password','Password (12+ characters)','password'],['password_confirmation','Confirm password','password']],async d=>{await api('register','POST',d);otp('verify');message.textContent='Account created. Request your email verification code.'})}
function otp(purpose){form(purpose==='verify'?'Verify email':'Reset password',[['email','Email','email']],async d=>{await api('otp/request','POST',{...d,purpose});form('Enter your six-digit code',[['code','Code'],...(purpose==='reset'?[['password','New password','password'],['password_confirmation','Confirm password','password']]:[])],async v=>{await api('otp/verify','POST',{...v,...d,purpose});login();message.textContent='Completed. Sign in.'});message.textContent='If this account exists, a code has been sent.'})}
async function profile(){user=await api('me');const f=form('Your profile',[['name','Full name'],['phone','Phone'],['country','Country code (e.g. MA)'],['city','City']],async d=>{user=await api('me','PATCH',d);message.textContent='Saved.'});for(const input of f.querySelectorAll('input')){input.value=user[input.name]||'';input.required=input.name==='name';}}
function password(){form('Change password',[['current_password','Current password','password'],['password','New password','password'],['password_confirmation','Confirm new password','password']],async d=>{await api('password','POST',d);message.textContent='Password changed.'})}
async function dashboard(){clear('Administration');const d=await api('admin/summary'),grid=node('div');grid.className='grid';for(const[k,v]of Object.entries(d)){if(typeof v==='number'){const c=node('div','',grid);c.className='metric';node('span',k.replaceAll('_',' '),c);node('strong',String(v),c)}}node('p',d.note)}
async function listing(kind,p=1){clear(kind==='users'?'Users':'Security audit');const d=await api('admin/'+kind+'?page='+p);const wrap=node('div');wrap.className='table-wrap';const table=node('table','',wrap),keys=kind==='users'?['id','name','email','role','suspended']:['created_at','user_id','event','ip','user_agent'];const tr=node('tr','',table);keys.forEach(k=>node('th',k,tr));for(const row of d.data){const tr=node('tr','',table);keys.forEach(k=>node('td',String(row[k]??'—'),tr));if(kind==='users'&&row.role!=='admin')action(row.suspended?'Enable':'Suspend',async()=>{await api('admin/users/'+row.id,'PATCH',{suspended:!row.suspended});listing(kind,p)},node('td','',tr))}const controls=node('nav');if(p>1)action('Previous',()=>listing(kind,p-1),controls);node('span',`Page ${p} / ${d.last_page}`,controls);if(p<d.last_page)action('Next',()=>listing(kind,p+1),controls);if(kind==='logs')node('small','IP and browser metadata are recorded by the server. Country and phone model are not inferred. Review events; a failed login alone is not proof of an attack.')}
async function integrations(){clear('API keys and models');const current=await api('admin/integrations'),f=node('form');f.className='panel';const choices={ai:['openai','anthropic','gemini','groq','mistral','openrouter'],jobs:['jsearch','adzuna','jooble','arbeitnow']};const addSelect=(name,label,values)=>{const l=node('label',label,f),s=node('select','',l);s.name=name;values.forEach(v=>{const o=node('option',v,s);o.value=v});return s};const type=addSelect('type','Integration type',['ai','jobs']),provider=addSelect('provider','Provider',choices.ai);type.onchange=()=>{provider.replaceChildren();choices[type.value].forEach(v=>{const o=node('option',v,provider);o.value=v})};for(const[k,label,typeName]of [['secret','API key','password'],['model','Model identifier','text'],['app_id','Adzuna app ID (only for Adzuna)','text']]){const l=node('label',label,f),i=node('input','',l);i.name=k;i.type=typeName;i.required=false}const enabled=node('label','Enable immediately',f),check=node('input','',enabled);check.type='checkbox';check.name='enabled';check.style.width='auto';node('button','Save encrypted key',f);f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));await api('admin/integrations','POST',{provider:d.provider,type:d.type,secret:d.secret||null,model:d.model||null,settings:d.app_id?{app_id:d.app_id}:null,enabled:!!d.enabled});message.textContent='Integration saved. Use Test before production.';integrations()};const list=node('section');for(const item of current.items){const c=node('article','',list);c.className='panel';node('h2',item.provider+' · '+item.type,c);node('p',(item.model||'No model')+' · '+(item.enabled?'Enabled':'Disabled'),c);action('Test connection',async()=>{const d=await api('admin/integrations/'+item.id+'/test','POST');message.textContent=d.message},c)}node('small','Keys are encrypted with APP_KEY and are never returned by the API.',view)}
function assistant(){const f=form('AI assistant',[['message','Ask about CVs, applications, users or system setup']],async d=>{const answer=await api('ai/chat','POST',d);const box=node('pre',answer.answer);box.className='panel'});f.querySelector('input').maxLength=6000}
async function jobs(){clear('Live job search');const f=node('form');f.className='panel';for(const[k,label,value]of [['q','Job title','Full-Stack Developer'],['country','Country code','MA'],['country_name','Country name','Morocco'],['city','City','']]){const l=node('label',label,f),i=node('input','',l);i.name=k;i.value=value}node('button','Search providers',f);const result=node('section');async function run(p=1){const body=Object.fromEntries(new FormData(f));body.page=p;const d=await api('jobs/search','POST',body);result.replaceChildren();node('p',`${d.count} results from ${d.provider}`,result);for(const job of d.data){const c=node('article','',result);c.className='panel';node('h2',job.title,c);node('p',job.company+' · '+job.location,c);if(job.match)node('p','CV match: '+job.match.score+'%',c);try{const u=new URL(job.url);if(u.protocol==='https:'){const a=node('a','Apply on original site',c);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}}}f.onsubmit=async e=>{e.preventDefault();try{await run()}catch(e){message.textContent=e.message}}}
try{user=await api('me')}catch{}menus();if(user)await profile();else login();
</script></html>
